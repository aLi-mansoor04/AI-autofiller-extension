<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>ApplyPilot</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 360px;
      margin: 0;
      padding: 16px;
      background: #0b0f17;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid #1e293b;
    }
    .title {
      font-size: 16px;
      font-weight: 800;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 99px;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    button {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 8px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .btn-primary {
      background: #10b981;
      color: #022c22;
    }
    .btn-primary:hover { background: #34d399; }
    .btn-sky {
      background: #0284c7;
      color: #ffffff;
    }
    .btn-sky:hover { background: #0369a1; }
    .btn-secondary {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
    }
    .btn-secondary:hover { background: #334155; }
    .status {
      margin-top: 8px;
      padding: 8px 10px;
      border-radius: 6px;
      background: #1e293b;
      font-size: 11px;
      color: #94a3b8;
      display: none;
    }
    .jd-panel {
      display: none;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #1e293b;
    }
    input, textarea {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      color: #f8fafc;
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 11px;
      margin-bottom: 6px;
    }
    label {
      display: block;
      font-size: 10px;
      color: #94a3b8;
      margin-bottom: 2px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">⚡ ApplyPilot</div>
    <span class="badge">100% Local-First</span>
  </div>

  <button id="autofill-btn" class="btn-primary">
    ⚡ Fill This Application (Alt+Shift+F)
  </button>

  <button id="extract-jd-btn" class="btn-sky">
    🎯 Extract JD & Tailor Resume (Alt+Shift+T)
  </button>

  <button id="options-btn" class="btn-secondary">
    ⚙️ Edit Profile, Master Resume & API Key
  </button>

  <div id="status-box" class="status"></div>

  <div id="jd-panel" class="jd-panel">
    <label>Company & Role</label>
    <input id="jd-company" placeholder="Company Name" />
    <input id="jd-role" placeholder="Role Title" />
    <label>Extracted Job Description (Editable)</label>
    <textarea id="jd-text" rows="4" placeholder="Job description text..."></textarea>
    <button id="run-tailor-btn" class="btn-primary">✨ Run AI Tailoring</button>
  </div>

  <div id="output-panel" class="jd-panel">
    <label style="color:#34d399; font-weight:700;">✨ Tailored Resume Output:</label>
    <textarea id="tailored-output-text" rows="8" style="font-family:monospace; font-size:10.5px; line-height:1.4;"></textarea>
    <button id="download-pdf-btn" class="btn-sky">📥 Download / Save as ATS PDF</button>
    <button id="copy-output-btn" class="btn-secondary">📋 Copy Full Tailored Resume</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
